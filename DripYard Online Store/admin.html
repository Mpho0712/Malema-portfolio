<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DripYard Admin Dashboard</title>
  <!-- SEO Meta Tags -->
<meta name="description" content="DripYard - Bold streetwear inspired by real culture. Shop T-Shirts, Hoodies, Caps & Beanies. Nationwide shipping in South Africa. Affordable, stylish streetwear.">
<meta name="keywords" content="streetwear, South Africa, t-shirts, hoodies, caps, beanies, DripYard, affordable clothing, street fashion">
<meta name="author" content="DripYard">
<meta name="robots" content="index, follow">

<!-- Open Graph (for social sharing) -->
<meta property="og:title" content="DripYard - Streetwear Inspired by the Streets">
<meta property="og:description" content="Bold streetwear inspired by real culture. Crafted for comfort, movement, and everyday confidence. Shop now - nationwide shipping.">
<meta property="og:image" content="https://dripyard.co.za/images/logo.png">
<meta property="og:url" content="https://dripyard.co.za">
<meta property="og:type" content="website">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="DripYard - Streetwear Inspired by the Streets">
<meta name="twitter:description" content="Bold streetwear inspired by real culture. Shop T-Shirts, Hoodies, Caps & Beanies. Nationwide shipping.">
<meta name="twitter:image" content="https://dripyard.co.za/images/logo.png">
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="admin-container">
    <!-- Header -->
    <div class="admin-header">
      <div class="logo-section">
        <img src="images/logo.png" alt="DripYard Logo" class="admin-logo" onerror="this.src='https://via.placeholder.com/40x40?text=DY'" />
        <h1>DripYard Admin Dashboard</h1>
      </div>
      <button id="logout-btn" class="logout-btn">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </div>

    <!-- Admin Notes Section -->
    <div class="admin-notes-section">
      <div class="section-header">
        <i class="fas fa-sticky-note"></i>
        <h3>Admin Notes</h3>
      </div>
      <textarea id="admin-notes-input" placeholder="Write your dashboard notes here..."></textarea>
      <button id="save-admin-notes" class="save-notes-btn">
        <i class="fas fa-save"></i> Save Notes
      </button>
      <div id="admin-notes-display" class="notes-display"></div>
    </div>

    <!-- Controls Bar -->
    <div class="controls-bar">
      <div class="filter-group">
        <label>
          <i class="fas fa-filter"></i> Filter by status:
          <select id="status-filter">
            <option value="all">All Orders</option>
            <option value="Order Placed">Order Placed</option>
            <option value="Order Confirmed">Order Confirmed</option>
            <option value="Processing">Processing</option>
            <option value="Shipped">Shipped</option>
            <option value="Delivered">Delivered</option>
          </select>
        </label>
      </div>
      <div class="search-group">
        <i class="fas fa-search"></i>
        <input type="text" id="search-bar" placeholder="Search by name or order ID..." />
      </div>
      <button id="export-csv" class="export-btn">
        <i class="fas fa-file-csv"></i> Export CSV
      </button>
    </div>

    <!-- Orders Table -->
    <div class="table-container">
      <table id="orders-table">
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Customer Info</th>
            <th>Items</th>
            <th>Address</th>
            <th>Method</th>
            <th>Status</th>
            <th>Tracking #</th>
            <th>Total</th>
            <th>Placed</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Orders will be injected here -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="delete-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <i class="fas fa-trash-alt"></i>
        <h3>Confirm Delete</h3>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete this order?</p>
        <p class="order-id-display" id="delete-order-id"></p>
        <p class="warning-text">This action cannot be undone!</p>
      </div>
      <div class="modal-footer">
        <button id="cancel-delete" class="cancel-btn">Cancel</button>
        <button id="confirm-delete" class="confirm-delete-btn">Delete Order</button>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
